name: Sovereign AI Council Autonomous Worker

on:
  schedule:
    - cron: "0 */6 * * *" # Runs autonomously in the cloud every 6 hours
  workflow_dispatch: # Allows manual trigger from GitHub UI / Mobile App
  repository_dispatch:
    types: [ai_council_trigger]

permissions:
  contents: write

jobs:
  autonomous-council-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Run Autonomous Council Analysis & Tests
        run: |
          node scripts/cloud-autonomous-council.mjs
          npm run build

      - name: Commit & Push Autonomous Cloud Improvements
        run: |
          git config --global user.name "AI-Council-Autonomous-Worker[bot]"
          git config --global user.email "ai-council-bot@users.noreply.github.com"
          git add docs/council-reports/
          if git diff --staged --quiet; then
            echo "No new autonomous changes to commit."
          else
            git commit -m "chore(ai-council): autonomous background cycle audit [skip ci]"
            git push origin main
          fi
